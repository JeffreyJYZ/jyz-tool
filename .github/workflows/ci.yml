name: ci

on:
    push:
        branches: [main]
    pull_request:

jobs:
    ci:
        strategy:
            fail-fast: false
            matrix:
                os: [macos-latest, ubuntu-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v7
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest
            - run: bun install --frozen-lockfile
            - run: bun run typecheck
            - run: bun run lint
            - run: bun run size
            - run: bun run format:check
            - run: bun run test
            - run: bun run jyz --version

    rust:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest
            - name: Tauri system dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
                    libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
            - uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt
            # `externalBin` names a staged sidecar; without it `tauri-build` refuses to configure.
            - name: Stage the CLI sidecar
              run: |
                  bun install --frozen-lockfile
                  bun packages/desktop/scripts/stage-sidecar.ts
            - name: Format
              working-directory: packages/desktop/src-tauri
              run: cargo fmt --check
            - name: Check
              working-directory: packages/desktop/src-tauri
              run: cargo check --locked
