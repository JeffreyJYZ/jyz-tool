name: release

on:
    push:
        tags: ["v*"]
    workflow_dispatch:

jobs:
    cli:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest
            - run: bun install --frozen-lockfile
            - run: bun run typecheck
            - run: bun run lint
            - run: bun run scripts/release.ts --all --no-desktop
            - uses: actions/upload-artifact@v4
              with:
                  name: cli
                  path: dist/release/*

    desktop:
        needs: cli
        strategy:
            fail-fast: false
            matrix:
                os: [macos-latest, ubuntu-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest
            - name: Linux bundle dependencies
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
                    libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
            - uses: dtolnay/rust-toolchain@stable
            - run: bun install --frozen-lockfile
            - name: Build the desktop shell
              working-directory: packages/desktop
              run: bun run build -- --config '{"version":"0.1.0"}'
            - run: bun run scripts/release.ts --no-cli
            - uses: actions/upload-artifact@v4
              with:
                  name: desktop-${{ matrix.os }}
                  path: dist/release/*

    publish:
        needs: [cli, desktop]
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest
            - uses: actions/download-artifact@v4
              with:
                  path: dist/release
                  merge-multiple: true
            - run: bun run scripts/release.ts --publish-only --publish
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
