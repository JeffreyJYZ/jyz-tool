<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>jyz</title>
		<style>
			:root {
				color-scheme: dark;
				--canvas: #0b0b0d;
				--panel: #111114;
				--line: #26262c;
				--ink: #e5e5e5;
				--muted: #8b8b93;
				--accent: #6ea8fe;
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				min-height: 100vh;
				display: flex;
				flex-direction: column;
				background: var(--canvas);
				color: var(--ink);
				font-family: ui-sans-serif, system-ui, sans-serif;
				font-size: 0.875rem;
			}
			main {
				flex: 1;
				width: 100%;
				max-width: 62rem;
				margin: 0 auto;
				padding: 1.5rem 1.25rem;
				display: flex;
				flex-direction: column;
				gap: 1rem;
			}
			nav.tabs {
				display: flex;
				gap: 0.5rem;
				border-bottom: 1px solid var(--line);
				padding-bottom: 0.5rem;
			}
			nav.tabs button {
				padding: 0.375rem 0.875rem;
				border: 1px solid var(--line);
				border-radius: 6px;
				background: var(--panel);
				color: var(--muted);
				font: inherit;
				cursor: pointer;
			}
			nav.tabs button.active {
				border-color: var(--accent);
				color: var(--accent);
			}
			.screen {
				display: none;
				flex-direction: column;
				gap: 1rem;
			}
			.screen.active {
				display: flex;
			}
			form {
				display: grid;
				grid-template-columns: 12rem 1fr;
				gap: 0.75rem 1rem;
				align-items: start;
			}
			label {
				display: flex;
				flex-direction: column;
				gap: 0.375rem;
				font-size: 0.6875rem;
				letter-spacing: 0.12em;
				text-transform: uppercase;
				color: var(--muted);
			}
			select,
			textarea,
			input {
				width: 100%;
				padding: 0.5rem 0.625rem;
				border: 1px solid var(--line);
				border-radius: 6px;
				background: var(--panel);
				color: var(--ink);
				font:
					0.8125rem/1.5 ui-monospace,
					monospace;
			}
			textarea {
				min-height: 5.5rem;
				resize: vertical;
			}
			select:focus-visible,
			textarea:focus-visible,
			input:focus-visible,
			button:focus-visible {
				outline: 2px solid var(--accent);
				outline-offset: 2px;
			}
			button {
				padding: 0.5rem 1.25rem;
				border: 1px solid var(--line);
				border-radius: 6px;
				background: var(--panel);
				color: var(--ink);
				font: inherit;
				cursor: pointer;
			}
			button:hover:enabled {
				border-color: var(--accent);
				color: var(--accent);
			}
			button:disabled {
				opacity: 0.55;
				cursor: progress;
			}
			table {
				width: 100%;
				border-collapse: collapse;
				font:
					0.8125rem/1.5 ui-monospace,
					monospace;
			}
			th,
			td {
				text-align: left;
				padding: 0.375rem 0.5rem;
				border-bottom: 1px solid var(--line);
				vertical-align: top;
				word-break: break-word;
			}
			th {
				color: var(--muted);
				font-size: 0.6875rem;
				letter-spacing: 0.12em;
				text-transform: uppercase;
			}
			pre {
				flex: 1;
				margin: 0;
				min-height: 12rem;
				padding: 0.75rem;
				overflow: auto;
				border: 1px solid var(--line);
				border-radius: 6px;
				background: var(--panel);
				color: var(--muted);
				font:
					0.8125rem/1.55 ui-monospace,
					monospace;
				white-space: pre-wrap;
				word-break: break-word;
			}
			pre[data-state="ok"] {
				color: var(--ink);
			}
			pre[data-state="error"] {
				color: #f08a8a;
			}
			footer {
				border-top: 1px solid var(--line);
				padding: 0.625rem 1.25rem;
				color: var(--muted);
				font:
					0.75rem/1.4 ui-monospace,
					monospace;
			}
			#update-banner {
				display: flex;
				align-items: center;
				gap: 0.75rem;
				padding: 0.625rem 0.875rem;
				border: 1px solid var(--line);
				border-radius: 6px;
				background: var(--panel);
				color: var(--ink);
			}
			#update-banner[hidden] {
				display: none;
			}
			#update-banner button {
				margin-left: auto;
			}
			@media (max-width: 34rem) {
				form {
					grid-template-columns: 1fr;
				}
			}
		</style>
	</head>
	<body>
		<main>
			<div id="update-banner" hidden></div>
			<nav class="tabs" id="tabs">
				<button type="button" data-screen="call" class="active">Call</button>
				<button type="button" data-screen="config">Config</button>
				<button type="button" data-screen="opencode">opencode</button>
			</nav>

			<section class="screen active" id="screen-call">
				<form id="call">
					<label for="method"
						>method
						<select id="method" name="method"></select>
					</label>
					<label for="params"
						>params
						<textarea id="params" name="params" spellcheck="false" autocomplete="off">
{}</textarea>
					</label>
					<button id="run" type="submit">Run</button>
				</form>
				<pre id="result" data-state="idle">no call yet</pre>
			</section>

			<section class="screen" id="screen-config">
				<div>
					<button id="config-refresh" type="button">Refresh</button>
				</div>
				<table id="config-table">
					<thead>
						<tr>
							<th>key</th>
							<th>value</th>
							<th>source</th>
						</tr>
					</thead>
					<tbody></tbody>
				</table>
				<pre id="config-raw" data-state="idle"></pre>
			</section>

			<section class="screen" id="screen-opencode">
				<label for="session"
					>session
					<select id="session"></select>
				</label>
				<label for="prompt"
					>prompt
					<textarea id="prompt" spellcheck="false" autocomplete="off"></textarea>
				</label>
				<div>
					<button id="send-prompt" type="button">Send</button>
					<button id="oc-refresh" type="button">Refresh</button>
				</div>
				<pre id="oc-status" data-state="idle">no sessions yet</pre>
				<table id="oc-table">
					<thead>
						<tr>
							<th>id</th>
							<th>title</th>
							<th>updated</th>
						</tr>
					</thead>
					<tbody></tbody>
				</table>
			</section>
		</main>
		<footer id="version">jyz · checking</footer>
		<script>
			const invoke = globalThis.__TAURI_INTERNALS__?.invoke;

			function screenFromHash(hash) {
				const cleaned = String(hash || "")
					.replace(/^#/, "")
					.replace(/^\/+/, "")
					.toLowerCase();
				const candidate = cleaned.split(/[/?]/)[0] || "";
				return ["call", "config", "opencode"].includes(candidate) ? candidate : "call";
			}

			function showScreen(name) {
				for (const btn of document.querySelectorAll("nav.tabs button")) {
					btn.classList.toggle("active", btn.dataset.screen === name);
				}
				for (const sec of document.querySelectorAll(".screen")) {
					sec.classList.toggle("active", sec.id === "screen-" + name);
				}
				if (name === "config") loadConfig();
				if (name === "opencode") {
					loadSessions();
					startWatch();
				} else stopWatch();
			}

			window.addEventListener("hashchange", () => showScreen(screenFromHash(location.hash)));

			document.querySelectorAll("nav.tabs button").forEach((btn) => {
				btn.addEventListener("click", () => {
					location.hash = "#" + btn.dataset.screen;
				});
			});

			// Call screen
			const picker = document.getElementById("method");
			const box = document.getElementById("params");
			const pane = document.getElementById("result");
			const button = document.getElementById("run");
			const form = document.getElementById("call");

			async function loadMethods() {
				if (!invoke) return;
				let manifest = [];
				try {
					manifest = await invoke("jyz_capabilities");
				} catch (e) {
					manifest = [];
				}
				if (!Array.isArray(manifest)) manifest = [];
				const groups = {};
				for (const entry of manifest) {
					if (groups[entry.kind] === undefined) groups[entry.kind] = [];
					groups[entry.kind].push(entry.name);
				}
				for (const [kind, names] of Object.entries(groups)) {
					const optgroup = document.createElement("optgroup");
					optgroup.label = kind;
					for (const name of names) {
						const option = document.createElement("option");
						option.value = name;
						option.textContent = name;
						optgroup.append(option);
					}
					picker.append(optgroup);
				}
				if (manifest.length > 0) picker.value = manifest[0].name;
			}
			loadMethods();

			function show(state, text) {
				pane.dataset.state = state;
				pane.textContent = text;
			}
			function messageOf(error) {
				return error instanceof Error ? error.message : String(error);
			}
			function settle(line) {
				let frame;
				try {
					frame = JSON.parse(line);
				} catch (error) {
					show("error", `answer is not JSON: ${messageOf(error)}`);
					return;
				}
				if (frame.error) {
					const code =
						typeof frame.error.code === "number" ? ` (${frame.error.code})` : "";
					show("error", `${frame.error.message ?? "the CLI reported an error"}${code}`);
					return;
				}
				try {
					show("ok", JSON.stringify(frame.result, null, 2));
				} catch {
					show("ok", String(frame.result));
				}
			}
			form.addEventListener("submit", async (event) => {
				event.preventDefault();
				if (!invoke) {
					show("error", "bridge unavailable: open this page inside the jyz window");
					return;
				}
				const text = box.value.trim();
				if (text !== "") {
					try {
						JSON.parse(text);
					} catch (error) {
						show("error", `params is not JSON: ${messageOf(error)}`);
						return;
					}
				}
				button.disabled = true;
				show("idle", "running…");
				try {
					const line = await invoke("jyz_call", { method: picker.value, params: text });
					settle(line);
				} catch (error) {
					show("error", messageOf(error));
				} finally {
					button.disabled = false;
				}
			});

			// Config screen
			const configBody = document.querySelector("#config-table tbody");
			const configRaw = document.getElementById("config-raw");
			async function loadConfig() {
				if (!invoke) {
					configRaw.dataset.state = "error";
					configRaw.textContent =
						"bridge unavailable: open this page inside the jyz window";
					return;
				}
				configRaw.dataset.state = "idle";
				configRaw.textContent = "loading…";
				try {
					const line = await invoke("jyz_call", {
						method: "config",
						params: JSON.stringify({ action: "show" }),
					});
					let frame;
					try {
						frame = JSON.parse(line);
					} catch (e) {
						throw e;
					}
					const stdout = frame && frame.result && (frame.result.stdout ?? frame.result);
					const text = typeof stdout === "string" ? stdout : JSON.stringify(frame.result);
					renderConfig(text);
					configRaw.dataset.state = "ok";
					configRaw.textContent = text;
				} catch (error) {
					configRaw.dataset.state = "error";
					configRaw.textContent = messageOf(error);
				}
			}
			function renderConfig(text) {
				configBody.innerHTML = "";
				const rows = configRows(text);
				for (const row of rows) {
					const tr = document.createElement("tr");
					for (const v of [row.key, row.value, row.source]) {
						const td = document.createElement("td");
						td.textContent = v;
						tr.append(td);
					}
					configBody.append(tr);
				}
			}
			function configRows(text) {
				const skip = ["config:", "layer:", "warning:", "aliases:", "scripts:"];
				const out = [];
				for (const raw of text.split(/\r?\n/)) {
					const line = raw.trim();
					if (line === "") continue;
					if (skip.some((p) => line.startsWith(p))) continue;
					const m = line.match(/^(.+?) = (.+) \(([^)]+)\)$/);
					if (!m) continue;
					out.push({ key: m[1].trim(), value: m[2].trim(), source: m[3].trim() });
				}
				return out;
			}
			document.getElementById("config-refresh").addEventListener("click", loadConfig);

			// opencode screen
			const sessionPicker = document.getElementById("session");
			const promptBox = document.getElementById("prompt");
			const ocStatus = document.getElementById("oc-status");
			const ocBody = document.querySelector("#oc-table tbody");
			let previousSessions = [];
			let watchTimer = null;

			function sessionRows(json) {
				let parsed;
				try {
					parsed = JSON.parse(json);
				} catch {
					return [];
				}
				if (!Array.isArray(parsed)) return [];
				const out = [];
				for (const item of parsed) {
					if (typeof item !== "object" || item === null || Array.isArray(item)) continue;
					if (typeof item.id !== "string" || item.id === "") continue;
					out.push({
						id: item.id,
						title: typeof item.title === "string" ? item.title : item.id,
						updatedAt: typeof item.updatedAt === "string" ? item.updatedAt : "",
					});
				}
				return out;
			}
			function diffSessions(prev, next) {
				const byId = new Map(prev.map((r) => [r.id, r]));
				const changed = [];
				for (const row of next) {
					const prior = byId.get(row.id);
					if (
						prior === undefined ||
						prior.title !== row.title ||
						prior.updatedAt !== row.updatedAt
					) {
						changed.push(row.id);
					}
				}
				return changed;
			}
			function renderSessions(rows, changed) {
				sessionPicker.innerHTML = "";
				for (const row of rows) {
					const option = document.createElement("option");
					option.value = row.id;
					option.textContent = row.title + " (" + row.id + ")";
					if (changed.includes(row.id)) option.textContent += " *";
					sessionPicker.append(option);
				}
				ocBody.innerHTML = "";
				for (const row of rows) {
					const tr = document.createElement("tr");
					for (const v of [row.id, row.title, row.updatedAt]) {
						const td = document.createElement("td");
						td.textContent = v;
						tr.append(td);
					}
					ocBody.append(tr);
				}
			}
			async function loadSessions() {
				if (!invoke) {
					ocStatus.dataset.state = "error";
					ocStatus.textContent =
						"bridge unavailable: open this page inside the jyz window";
					return;
				}
				try {
					const out = await invoke("jyz_oc", { args: ["sessions", "--json"] });
					const rows = sessionRows(out);
					const changed = diffSessions(previousSessions, rows);
					previousSessions = rows;
					renderSessions(rows, changed);
					ocStatus.dataset.state = "ok";
					ocStatus.textContent =
						rows.length === 0
							? "no sessions"
							: `${rows.length} session(s)` +
								(changed.length ? ` · changed: ${changed.join(", ")}` : "");
				} catch (error) {
					ocStatus.dataset.state = "error";
					ocStatus.textContent = `opencode server unavailable: ${messageOf(error)}`;
				}
			}
			document.getElementById("oc-refresh").addEventListener("click", loadSessions);
			document.getElementById("send-prompt").addEventListener("click", async () => {
				if (!invoke) return;
				const session = sessionPicker.value;
				const text = promptBox.value.trim();
				if (!session || !text) {
					ocStatus.dataset.state = "error";
					ocStatus.textContent = "pick a session and type a prompt";
					return;
				}
				try {
					await invoke("jyz_oc", {
						args: ["prompt", text, "--session", session, "--json"],
					});
					ocStatus.dataset.state = "ok";
					ocStatus.textContent = `sent to ${session}`;
				} catch (error) {
					ocStatus.dataset.state = "error";
					ocStatus.textContent = messageOf(error);
				}
			});
			function startWatch() {
				stopWatch();
				watchTimer = setInterval(loadSessions, 5000);
			}
			function stopWatch() {
				if (watchTimer !== null) {
					clearInterval(watchTimer);
					watchTimer = null;
				}
			}

			const updateBanner = document.getElementById("update-banner");

			function renderUpdate(offer) {
				if (!offer || typeof offer.version !== "string") return;
				updateBanner.hidden = false;
				updateBanner.textContent = "";
				const span = document.createElement("span");
				span.textContent = `update available: ${offer.version}`;
				updateBanner.append(span);
				if (typeof offer.notes === "string" && offer.notes !== "") {
					const detail = document.createElement("span");
					detail.textContent = offer.notes;
					updateBanner.append(detail);
				}
				const btn = document.createElement("button");
				btn.type = "button";
				btn.textContent = "Install";
				btn.addEventListener("click", async () => {
					if (!invoke) return;
					btn.disabled = true;
					btn.textContent = "installing… the app will restart";
					try {
						await invoke("jyz_update_install");
					} catch (error) {
						btn.disabled = false;
						btn.textContent = "Install";
						updateBanner.append(
							Object.assign(document.createElement("span"), {
								textContent: messageOf(error),
							}),
						);
					}
				});
				updateBanner.append(btn);
			}

			const footer = document.getElementById("version");
			// The first render runs last: showScreen reaches the screens' own consts, and a
			// declaration above their initializer would throw on a deep link. Wiring the tab
			// strip first also means a click always has a handler.
			showScreen(screenFromHash(location.hash || "#call"));
			if (!invoke) {
				footer.textContent = "jyz · bridge unavailable outside the window";
			} else {
				invoke("jyz_version")
					.then((version) => {
						footer.textContent = version;
					})
					.catch((error) => {
						footer.textContent = `jyz · ${messageOf(error)}`;
					});
				invoke("jyz_update_check")
					.then((offer) => {
						if (offer) renderUpdate(offer);
					})
					.catch(() => {});
			}
		</script>
	</body>
</html>
